[project]
name = "noteboard"
version = "0.1.0"
description = "Popup clipboard and sticky notes for KDE Wayland"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
]

[project.scripts]
noteboard = "noteboard.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noteboard"]

[tool.setuptools.package-data]
noteboard = ["qml/*.qml", "kwin/*.js"]
